  <!-- 모던 웹 폰트: Pretendard (불러오지 못하면 기기 기본 글꼴로 자동 대체) -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- 외부 사이트 없이 동작하도록 React와 스타일을 앱 안에 포함 (src/ 원본을 npm run build로 만든 파일) -->
  <link rel="stylesheet" href="app.css">
    <meta name="theme-color" content="#1E3A8A">
    <!-- 📱 앱처럼 설치 (홈 화면에 추가) -->
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="교직논술">
    <style>.install-btn{display:none}html.can-install .install-btn{display:inline}.install-btn button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}</style>
</head>
<body class="bg-background text-slate-800 font-sans antialiased selection:bg-indigo-100 selection:text-indigo-900">

  <div id="root"></div>

  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="app.js"></script>
    <!-- 📲 앱 설치 버튼 (설치할 수 있는 브라우저에서만 보임) -->
    <script>
    (function () {
        var deferred = null, root = document.documentElement;
        var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        var installed = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
        window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; root.classList.add('can-install'); });
        window.addEventListener('appinstalled', function () { deferred = null; root.classList.remove('can-install'); });
        if (ios && !installed) root.classList.add('can-install');
        document.addEventListener('click', function (e) {
            var btn = e.target.closest && e.target.closest('.install-btn button');
            if (!btn) return;
            if (deferred) {
                deferred.prompt();
                deferred.userChoice.then(function () { deferred = null; root.classList.remove('can-install'); });
            } else if (ios) {
                alert('Safari 아래쪽 공유 버튼(□↑)을 누른 뒤 "홈 화면에 추가"를 선택하세요.');
            }
        });
        if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
            window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { /* 설치 기능만 빠지고 앱은 그대로 동작 */ }); });
        }
    })();
    </script>
</body>
</html>
