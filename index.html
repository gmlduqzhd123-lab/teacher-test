<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>초등교직논술 AI 모의고사</title>
  
  <!-- React 및 ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- [모의 데이터 (Mock Data)] ---
    // API 통신 없이 즉시 렌더링하기 위한 사전 제작된 모의고사 데이터입니다.
    const MOCK_EXAM_DATA = {
      "title": "2022 개정 교육과정과 학생 주도성 관련 모의고사",
      "scenario": [
        "김 교사: 2022 개정 교육과정에서는 '학생 주도성'을 특히 강조하고 있어요. 우리 학교 교육과정에도 이를 적극적으로 반영해야 할 것 같습니다.",
        "박 교사: 맞아요. 학생들이 스스로 학습 목표를 설정하고, 학습 과정에 참여하며, 결과를 성찰하는 과정이 중요하죠. 이를 위해 교과 수업에서 어떤 변화를 주어야 할까요?",
        "최 교사: 저는 평가 방식의 변화도 필수적이라고 봐요. 학생의 성장을 돕는 과정 중심 평가가 제대로 이루어져야 학생 주도성도 길러질 수 있다고 생각합니다."
      ],
      "questions": [
        {"id": 1, "task": "2022 개정 교육과정에서 강조하는 '학생 주도성'의 개념과 교사의 역할 2가지를 논하시오.", "score": 4},
        {"id": 2, "task": "학생 주도성을 기르기 위한 교수·학습 방안 2가지를 제시하시오.", "score": 4},
        {"id": 3, "task": "과정 중심 평가가 학생 주도성 함양에 미치는 긍정적 영향 2가지를 설명하시오.", "score": 4},
        {"id": 4, "task": "학급 내에서 학생 주도성을 저해하는 요인 1가지와 그 해결 방안 1가지를 논하시오.", "score": 3}
      ],
      "formatScore": 5
    };

    const MOCK_RESULT_DATA = {
      "totalScore": 17,
      "contentScore": 13,
      "formatScore": 4,
      "contentFeedback": [
        {
          "questionId": 1,
          "task": "학생 주도성의 개념과 교사의 역할",
          "earnedScore": 3,
          "maxScore": 4,
          "missingKeywords": ["조력자", "촉진자"],
          "comment": "학생 주도성의 개념은 잘 서술하였으나, 교사의 역할을 '안내자'로만 한정하여 구체적인 조력자나 촉진자로서의 역할 서술이 부족하여 감점되었습니다."
        },
        {
          "questionId": 2,
          "task": "학생 주도성을 기르기 위한 교수·학습 방안",
          "earnedScore": 4,
          "maxScore": 4,
          "missingKeywords": [],
          "comment": "프로젝트 학습과 학생 참여형 수업을 적절히 제시하여 만점입니다."
        },
        {
          "questionId": 3,
          "task": "과정 중심 평가가 학생 주도성 함양에 미치는 영향",
          "earnedScore": 3,
          "maxScore": 4,
          "missingKeywords": ["자기 성찰"],
          "comment": "피드백을 통한 개선은 훌륭하게 언급했으나, 학생 스스로 자신의 학습을 돌아보는 '자기 성찰' 기회 제공 측면이 누락되었습니다."
        },
        {
          "questionId": 4,
          "task": "학생 주도성 저해 요인과 해결 방안",
          "earnedScore": 3,
          "maxScore": 3,
          "missingKeywords": [],
          "comment": "교사 중심의 일방적 지시를 저해 요인으로 꼽고, 학급 규칙 제정 시 학생 참여를 보장하는 방안을 매우 타당하게 제시했습니다."
        }
      ],
      "formatFeedback": {
        "structureComment": "서론-본론-결론의 3단 구성이 명확하게 갖춰져 있으며, 단락 간의 연결이 자연스럽습니다.",
        "grammarComment": "전반적으로 우수하나, 일부 문장에서 주어와 서술어의 호응이 어색한 부분(예: '교사는 ~할 수 있다'가 아닌 '교사는 ~해야 한다'로 통일)이 있어 1점 감점되었습니다."
      },
      "overallReview": "학생 주도성과 2022 개정 교육과정의 핵심을 잘 짚어낸 우수한 답안입니다. 교육학적 전문 용어(촉진자, 자기 성찰 등)를 조금 더 적극적으로 활용한다면 완벽한 논술이 될 것입니다."
    };

    function App() {
      // --- [상태 관리] ---
      const [status, setStatus] = useState('setup');
      
      const [examData, setExamData] = useState(null);
      const [answer, setAnswer] = useState('');
      const [resultData, setResultData] = useState(null);
      
      const [timeLeft, setTimeLeft] = useState(3600);
      const [isSaved, setIsSaved] = useState(false);
      const [charCount, setCharCount] = useState({ total: 0, noSpaces: 0 });

      // --- [초기 로드 및 자동 저장] ---
      useEffect(() => {
        const savedDraft = localStorage.getItem('essay_draft');
        if (savedDraft && status === 'setup') setAnswer(savedDraft);
      }, [status]);

      useEffect(() => {
        setCharCount({
          total: answer.length,
          noSpaces: answer.replace(/\s/g, '').length,
        });

        const timeoutId = setTimeout(() => {
          if (answer && status === 'exam') {
            localStorage.setItem('essay_draft', answer);
            setIsSaved(true);
            setTimeout(() => setIsSaved(false), 2000);
          }
        }, 1000);
        return () => clearTimeout(timeoutId);
      }, [answer, status]);

      // 타이머 최적화
      useEffect(() => {
        let timer;
        if (status === 'exam') {
          timer = setInterval(() => {
            setTimeLeft((prev) => {
              if (prev <= 1) {
                clearInterval(timer);
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(timer);
      }, [status]);

      // --- [액션 핸들러 (Mock API 호출 에뮬레이션)] ---
      const handleStartExam = async () => {
        setAnswer('');
        localStorage.removeItem('essay_draft');
        setStatus('generating');
        
        // 자연스러운 UI 경험을 위해 1.5초 대기 효과 추가
        setTimeout(() => {
          setExamData(MOCK_EXAM_DATA);
          setTimeLeft(3600);
          setStatus('exam');
        }, 1500);
      };

      const handleSubmit = async () => {
        if (!answer.trim()) return alert('답안을 작성해주세요.');
        if (!confirm('답안을 제출하고 채점을 진행하시겠습니까? (현재 데모 버전이므로 작성한 내용과 무관하게 예시 채점 결과가 출력됩니다.)')) return;
        
        setStatus('grading');
        
        // 자연스러운 UI 경험을 위해 2초 대기 효과 추가
        setTimeout(() => {
          setResultData(MOCK_RESULT_DATA);
          setStatus('result');
          localStorage.removeItem('essay_draft');
        }, 2000);
      };

      const formatTime = (seconds) => {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      };

      // --- [UI 렌더링] ---
      return (
        <div className="min-h-screen p-4 flex flex-col items-center">
          <div className="w-full max-w-5xl space-y-6">
            
            {/* 헤더 */}
            <header className="bg-white p-6 rounded-xl shadow border border-gray-200">
              <h1 className="text-2xl font-bold text-blue-700">초등교직논술 AI 모의고사 (데모 버전)</h1>
              <p className="text-gray-500 mt-1">API 연결 없이 즉시 체험 가능한 오프라인 모드입니다.</p>
            </header>

            {/* 설정 화면 */}
            {status === 'setup' && (
              <div className="bg-white p-12 rounded-xl shadow border border-gray-200 flex flex-col items-center text-center gap-6">
                <div className="bg-blue-50 p-6 rounded-lg w-full">
                  <h3 className="text-lg font-bold text-blue-800 mb-2">📌 체험 안내</h3>
                  <p className="text-blue-600">이 버전은 API 키 입력 없이 UI/UX 흐름을 테스트하기 위한 <strong>미리보기(Mock) 버전</strong>입니다. <br/>아래 버튼을 누르면 고정된 모의고사 문제가 바로 출제됩니다.</p>
                </div>
                <button 
                  onClick={handleStartExam}
                  className="bg-blue-600 hover:bg-blue-700 text-white font-bold text-lg py-5 px-12 rounded-full shadow-lg transition-transform transform hover:scale-105"
                >
                  데모 모의고사 시작하기
                </button>
              </div>
            )}

            {/* 로딩 화면 */}
            {(status === 'generating' || status === 'grading') && (
              <div className="bg-white p-12 rounded-xl shadow text-center border border-gray-200">
                <div className="text-xl font-bold animate-pulse text-blue-600">
                  {status === 'generating' ? '문제를 불러오고 있습니다...' : '답안을 꼼꼼하게 채점 중입니다...'}
                </div>
              </div>
            )}

            {/* 시험 화면 */}
            {status === 'exam' && examData && (
              <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                {/* 지문 영역 */}
                <div className="bg-white p-6 rounded-xl shadow border border-gray-200 h-[800px] overflow-y-auto">
                  <h2 className="text-xl font-bold mb-4">{examData.title}</h2>
                  <div className="bg-gray-100 p-4 rounded-lg mb-6 space-y-3">
                    {examData.scenario.map((line, idx) => (
                      <p key={idx} className="leading-relaxed">{line}</p>
                    ))}
                  </div>
                  <h3 className="font-bold text-lg mb-3">작성 조건 및 배점 (총 15점)</h3>
                  <ul className="list-decimal pl-5 space-y-2">
                    {examData.questions.map((q) => (
                      <li key={q.id}>{q.task} [{q.score}점]</li>
                    ))}
                  </ul>
                </div>

                {/* 답안 작성 에디터 */}
                <div className="bg-white p-6 rounded-xl shadow border border-gray-200 flex flex-col h-[800px]">
                  <div className="flex justify-between items-center bg-gray-100 p-3 rounded-lg mb-4">
                    <div className={`text-xl font-bold ${timeLeft < 600 ? 'text-red-600' : 'text-blue-600'}`}>
                      남은 시간: {formatTime(timeLeft)}
                    </div>
                    <div className="text-sm text-gray-500 font-medium">
                      {isSaved ? '✅ 임시 저장됨' : '작성 중...'}
                    </div>
                  </div>
                  
                  <textarea
                    value={answer}
                    onChange={(e) => setAnswer(e.target.value)}
                    placeholder="여기에 답안을 작성하세요. (권장: 1,100 ~ 1,200자)"
                    className="flex-1 w-full p-4 border rounded-lg resize-none focus:ring-2 focus:ring-blue-500 outline-none text-lg leading-relaxed mb-4"
                    spellCheck={false}
                  />
                  
                  <div className="flex justify-between items-center">
                    <span className="text-sm text-gray-600 font-medium">
                      공백 포함: {charCount.total}자 / 공백 제외: {charCount.noSpaces}자
                    </span>
                    <button 
                      onClick={handleSubmit}
                      className="bg-gray-800 hover:bg-black text-white font-bold py-2 px-6 rounded-lg transition"
                    >
                      답안 제출하기
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* 채점 결과 대시보드 */}
            {status === 'result' && resultData && (
              <div className="bg-white p-8 rounded-xl shadow border border-gray-200 space-y-8">
                <div className="text-center border-b pb-6">
                  <h2 className="text-3xl font-bold text-gray-800">최종 점수: {resultData.totalScore} / 20점</h2>
                  <p className="text-gray-600 mt-2">{resultData.overallReview}</p>
                </div>

                <div>
                  <h3 className="text-xl font-bold text-blue-700 mb-4 flex items-center">
                    내용 영역 ({resultData.contentScore} / 15점)
                  </h3>
                  <div className="space-y-4">
                    {resultData.contentFeedback.map((fb) => (
                      <div key={fb.questionId} className="bg-blue-50 p-4 rounded-lg border-l-4 border-blue-500">
                        <div className="flex justify-between font-bold mb-2">
                          <span>{fb.task}</span>
                          <span>{fb.earnedScore} / {fb.maxScore}점</span>
                        </div>
                        {fb.missingKeywords && fb.missingKeywords.length > 0 && (
                          <p className="text-sm text-red-600 mb-1">
                            누락 키워드: {fb.missingKeywords.join(', ')}
                          </p>
                        )}
                        <p className="text-gray-700 text-sm leading-relaxed">{fb.comment}</p>
                      </div>
                    ))}
                  </div>
                </div>

                <div>
                  <h3 className="text-xl font-bold text-green-700 mb-4 flex items-center">
                    체계 영역 ({resultData.formatScore} / 5점)
                  </h3>
                  <div className="bg-green-50 p-4 rounded-lg border-l-4 border-green-500 space-y-3">
                    <p className="text-sm text-gray-700"><strong className="text-gray-900">논리적 체계성:</strong> {resultData.formatFeedback.structureComment}</p>
                    <p className="text-sm text-gray-700"><strong className="text-gray-900">맞춤법 및 어휘:</strong> {resultData.formatFeedback.grammarComment}</p>
                  </div>
                </div>

                <div className="text-center pt-4">
                  <button 
                    onClick={() => { setStatus('setup'); setAnswer(''); setExamData(null); }}
                    className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg transition"
                  >
                    메인 화면으로 돌아가기
                  </button>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
</html>
