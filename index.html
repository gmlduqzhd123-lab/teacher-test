<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>초등교직논술 모의고사</title>
  
  <!-- 모던 웹 폰트: Pretendard 적용 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  
  <!-- React 및 ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS CDN 및 커스텀 설정 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
          },
          colors: {
            primary: '#4f46e5', // Indigo 600
            primaryHover: '#4338ca', // Indigo 700
            surface: '#ffffff',
            background: '#f8fafc', // Slate 50
          }
        }
      }
    }
  </script>
</head>
<body class="bg-background text-slate-800 font-sans antialiased selection:bg-indigo-100 selection:text-indigo-900">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- [랜덤 키워드 DB] ---
    const EDUCATIONAL_KEYWORDS = [
      "과정 중심 평가", "학생 주도성", "늘봄학교", "기초학력 보장",
      "에듀테크 활용", "생태전환교육", "민주시민교육", "학습 부진 지도",
      "창의·융합 교육", "다문화 교육", "회복적 생활교육", "학교폭력 예방"
    ];

    // --- [동적 모의고사 출제 로직] ---
    const generateMockExam = (topic) => ({
      title: `[${topic}] 관련 초등교직논술 모의고사`,
      scenario: [
        `김 교사: 최근 학교 현장에서 '${topic}'에 대한 중요성이 점차 커지고 있습니다. 내년도 우리 학교 교육과정 운영 계획에도 이를 적극적으로 반영해야 할 것 같아요.`,
        `박 교사: 맞습니다. 특히 교과 수업과 창의적 체험활동을 연계하여 학생들이 '${topic}' 역량을 내면화할 수 있도록 돕는 실질적인 방안을 고민해야 합니다.`,
        `최 교사: 교수·학습 측면뿐만 아니라, 학급 경영 측면에서도 이를 지원할 수 있는 긍정적인 학급 분위기 조성과 학부모와의 긴밀한 소통 및 협력이 필수적이라고 생각합니다.`
      ],
      questions: [
        {id: 1, task: `'${topic}' 교육이 가지는 긍정적 효과 2가지와 교사에게 요구되는 역할 2가지를 논하시오.`, score: 4},
        {id: 2, task: `교과 수업과 창의적 체험활동을 연계한 '${topic}' 지도 방안을 각각 1가지씩 제시하시오.`, score: 4},
        {id: 3, task: `학급 경영 측면에서 '${topic}' 역량 함양을 돕기 위한 환경 조성 방안 2가지를 논하시오.`, score: 4},
        {id: 4, task: `이와 관련하여 학부모 상담 시 교사가 유의해야 할 점 3가지를 제시하시오.`, score: 3}
      ],
      formatScore: 5
    });

    // --- [동적 채점 알고리즘] ---
    const evaluateAnswer = (answer, topic, examData) => {
      let contentScore = 0;
      let formatScore = 0;
      const cleanAnswer = answer.trim();
      const length = cleanAnswer.replace(/\s/g, '').length;

      if (length < 200) formatScore = 1;
      else if (length < 500) formatScore = 2;
      else if (length < 800) formatScore = 3;
      else if (length < 1000) formatScore = 4;
      else formatScore = 5;

      const contentFeedback = examData.questions.map(q => {
        let earned = 0;
        let comment = "";
        let missing = [];

        if (length < 100) {
          comment = "답안 내용이 극히 부족하여 해당 논제에 대한 점수를 부여할 수 없습니다.";
          earned = 0;
          missing = ["핵심 논점 전면 누락"];
        } else {
          if (cleanAnswer.includes(topic)) {
            if (length < 500) {
              earned = Math.max(1, q.score - 2);
              comment = `주제('${topic}')에 대한 언급은 있으나, 글자 수가 부족하여 구체적인 논증과 실천 방안 서술이 미흡합니다.`;
              missing = ["구체적 실천 방안", "교육학적 근거"];
            } else if (length < 900) {
              earned = Math.max(2, q.score - 1);
              comment = `논제 요구사항을 대체로 충족하였으나, 보다 심층적인 교사의 역할과 현장 적용 방안이 추가되면 좋습니다.`;
            } else {
              earned = q.score;
              comment = `주제에 대한 이해도가 높고 요구하는 가지 수를 충족하여 구체적이고 타당하게 서술하였습니다.`;
            }
          } else {
            earned = Math.max(0, q.score - 3);
            comment = `논제의 핵심 키워드인 '${topic}'에 대한 명시적인 언급과 논리적 연결이 부족하여 큰 폭으로 감점되었습니다.`;
            missing = [topic];
          }
        }
        contentScore += earned;
        return {
          questionId: q.id,
          task: q.task,
          earnedScore: earned,
          maxScore: q.score,
          missingKeywords: missing,
          comment: comment
        };
      });

      return {
        totalScore: contentScore + formatScore,
        contentScore,
        formatScore,
        contentFeedback,
        formatFeedback: {
          structureComment: length > 900 
            ? "서론-본론-결론의 3단 구성이 명확하며 단락 간의 논리적 연결이 자연스럽습니다." 
            : "글의 분량이 부족하여 논리적 체계성을 판단하기 어렵거나 구조가 미흡합니다.",
          grammarComment: length > 900 
            ? "교직논술에 적합한 어휘 및 문장 호응을 적절하게 사용했습니다." 
            : "문장 구성이 단조롭거나 논술형 문장에 적합하지 않은 짧은 표현이 다수 있습니다."
        },
        overallReview: length > 900 
          ? "제시된 키워드에 대한 높은 이해도와 훌륭한 교육학적 식견이 돋보이는 우수한 답안입니다." 
          : `답안 분량(현재 공백 제외 ${length}자)이 절대적으로 부족합니다. 1,100자 내외로 작성하는 연습이 필요합니다.`
      };
    };

    function App() {
      const [status, setStatus] = useState('setup');
      const [topic, setTopic] = useState('');
      
      const [examData, setExamData] = useState(null);
      const [answer, setAnswer] = useState('');
      const [resultData, setResultData] = useState(null);
      
      const [timeLeft, setTimeLeft] = useState(3600);
      const [isSaved, setIsSaved] = useState(false);
      const [charCount, setCharCount] = useState({ total: 0, noSpaces: 0 });

      useEffect(() => {
        const savedDraft = localStorage.getItem('essay_draft');
        if (savedDraft && status === 'setup') setAnswer(savedDraft);
      }, [status]);

      useEffect(() => {
        setCharCount({
          total: answer.length,
          noSpaces: answer.replace(/\s/g, '').length,
        });

        const timeoutId = setTimeout(() => {
          if (answer && status === 'exam') {
            localStorage.setItem('essay_draft', answer);
            setIsSaved(true);
            setTimeout(() => setIsSaved(false), 2000);
          }
        }, 1000);
        return () => clearTimeout(timeoutId);
      }, [answer, status]);

      useEffect(() => {
        let timer;
        if (status === 'exam') {
          timer = setInterval(() => {
            setTimeLeft((prev) => {
              if (prev <= 1) {
                clearInterval(timer);
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => clearInterval(timer);
      }, [status]);

      const handleRandomKeyword = () => {
        const randomIndex = Math.floor(Math.random() * EDUCATIONAL_KEYWORDS.length);
        setTopic(EDUCATIONAL_KEYWORDS[randomIndex]);
      };

      const handleStartExam = () => {
        const targetTopic = topic.trim() || '2022 개정 교육과정';
        
        setAnswer('');
        localStorage.removeItem('essay_draft');
        setStatus('generating');
        
        setTimeout(() => {
          setExamData(generateMockExam(targetTopic));
          setTimeLeft(3600);
          setStatus('exam');
        }, 800);
      };

      const handleSubmit = () => {
        if (!answer.trim()) return alert('답안을 작성해주세요.');
        if (!confirm('답안을 제출하고 채점을 진행하시겠습니까?')) return;
        
        setStatus('grading');
        
        setTimeout(() => {
          setResultData(evaluateAnswer(answer, topic.trim() || '2022 개정 교육과정', examData));
          setStatus('result');
          localStorage.removeItem('essay_draft');
        }, 1500);
      };

      const handleGoHome = () => {
        if (answer.trim().length > 0) {
          if (!confirm('작성 중인 답안이 있습니다. 정말 홈으로 돌아가시겠습니까?\n(돌아가면 작성 내용이 모두 초기화됩니다.)')) return;
        }
        setStatus('setup');
        setAnswer('');
        setTopic('');
        setExamData(null);
        localStorage.removeItem('essay_draft');
      };

      const formatTime = (seconds) => {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      };

      return (
        <div className="min-h-screen p-4 md:p-8 flex flex-col items-center justify-between selection:bg-indigo-100">
          <div className="w-full max-w-6xl space-y-6 flex-grow">
            
            {/* 공통 헤더 (홈버튼 및 타이틀) */}
            <header className="bg-surface py-5 px-6 md:px-8 rounded-2xl shadow-sm border border-slate-100 text-center flex items-center justify-center relative">
              {(status === 'exam' || status === 'result') && (
                <button 
                  onClick={handleGoHome}
                  className="absolute left-4 md:left-8 flex items-center gap-1.5 text-slate-500 hover:text-primary font-bold transition-colors text-sm md:text-base px-2 py-1 rounded-lg hover:bg-indigo-50"
                >
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                  </svg>
                  <span className="hidden sm:inline">홈으로</span>
                </button>
              )}
              
              <div className="flex items-center gap-3">
                <svg className="w-7 h-7 md:w-8 md:h-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                </svg>
                <h1 className="text-xl md:text-3xl font-extrabold text-slate-800 tracking-tight">초등교직논술 모의고사</h1>
              </div>
            </header>

            {/* 1. 설정 화면 */}
            {status === 'setup' && (
              <div className="bg-surface p-8 md:p-16 rounded-3xl shadow-sm border border-slate-100 flex flex-col items-center text-center gap-10 mt-8 md:mt-12 w-full max-w-2xl mx-auto">
                <div className="w-full text-left space-y-3">
                  <div className="flex justify-between items-end mb-2">
                    <label className="block text-lg font-bold text-slate-700">어떤 주제로 연습할까요?</label>
                    <button 
                      onClick={handleRandomKeyword}
                      className="flex items-center gap-1.5 text-sm font-bold text-primary bg-indigo-50 hover:bg-indigo-100 px-3 py-1.5 rounded-lg transition-colors"
                    >
                      <span>🎲</span> 랜덤 키워드
                    </button>
                  </div>
                  <input 
                    type="text" 
                    value={topic} 
                    onChange={(e) => setTopic(e.target.value)}
                    placeholder="예: 학생 주도성, 늘봄학교, 기초학력 등" 
                    className="w-full p-5 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-100 focus:border-primary outline-none text-lg transition-all duration-300 placeholder-slate-400"
                    onKeyDown={(e) => e.key === 'Enter' && handleStartExam()}
                  />
                  <p className="text-sm text-slate-500 font-medium pl-2 pt-1">입력한 키워드를 중심으로 출제 위원회가 맞춤형 지문을 구성합니다.</p>
                </div>
                <button 
                  onClick={handleStartExam}
                  className="w-full md:w-auto bg-primary hover:bg-primaryHover text-white font-bold text-lg md:text-xl py-5 px-16 rounded-2xl shadow-lg shadow-indigo-200 transition-all duration-300 transform hover:-translate-y-1 active:translate-y-0"
                >
                  모의고사 시작하기
                </button>
              </div>
            )}

            {/* 로딩 화면 */}
            {(status === 'generating' || status === 'grading') && (
              <div className="bg-surface p-16 rounded-3xl shadow-sm border border-slate-100 text-center mt-12 w-full max-w-2xl mx-auto">
                <div className="inline-block animate-spin rounded-full h-12 w-12 border-4 border-slate-200 border-t-primary mb-6"></div>
                <div className="text-xl md:text-2xl font-bold text-slate-700">
                  {status === 'generating' ? '맞춤형 모의고사를 출제하고 있습니다...' : '수석 채점관이 답안을 분석하고 있습니다...'}
                </div>
              </div>
            )}

            {/* 2. 시험 화면 */}
            {status === 'exam' && examData && (
              <div className="flex flex-col lg:flex-row gap-6 mt-6">
                
                {/* 왼쪽: 지문 영역 */}
                <div className="w-full lg:w-5/12 bg-surface p-6 md:p-8 rounded-3xl shadow-sm border border-slate-100 flex flex-col h-[500px] lg:h-[750px]">
                  <h2 className="text-xl md:text-2xl font-bold mb-6 text-slate-800 leading-snug">{examData.title}</h2>
                  
                  <div className="flex-grow overflow-y-auto pr-2 custom-scrollbar space-y-6 mb-6">
                    <div className="bg-slate-50 p-6 rounded-2xl space-y-5 border border-slate-100">
                      {examData.scenario.map((line, idx) => (
                        <p key={idx} className="leading-relaxed text-slate-700 text-base md:text-lg break-keep">{line}</p>
                      ))}
                    </div>
                  </div>

                  <div className="pt-4 border-t border-slate-100">
                    <div className="flex items-center gap-2 mb-4">
                      <span className="bg-indigo-100 text-primary px-3 py-1 rounded-lg text-sm font-bold">총 15점</span>
                      <h3 className="font-bold text-lg text-slate-800">작성 조건 및 배점</h3>
                    </div>
                    <ul className="list-decimal pl-5 space-y-3 font-medium text-slate-600 text-sm md:text-base">
                      {examData.questions.map((q) => (
                        <li key={q.id} className="leading-relaxed pl-1">{q.task} <span className="text-primary font-bold ml-1">[{q.score}점]</span></li>
                      ))}
                    </ul>
                  </div>
                </div>

                {/* 오른쪽: 답안 작성 에디터 */}
                <div className="w-full lg:w-7/12 bg-surface p-6 md:p-8 rounded-3xl shadow-sm border border-slate-100 flex flex-col h-[600px] lg:h-[750px]">
                  
                  {/* 상단 타이머 바 */}
                  <div className="flex flex-wrap justify-between items-center bg-slate-50 border border-slate-100 p-4 rounded-2xl mb-6 gap-4">
                    <div className="flex items-center gap-3">
                      <div className="bg-white p-2 rounded-xl shadow-sm">
                        <svg className={`w-6 h-6 ${timeLeft < 600 ? 'text-red-500 animate-pulse' : 'text-primary'}`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                      </div>
                      <div className={`text-2xl font-black font-mono tracking-wider ${timeLeft < 600 ? 'text-red-600' : 'text-slate-700'}`}>
                        {formatTime(timeLeft)}
                      </div>
                    </div>
                    <div className="text-sm font-bold text-slate-500 bg-white px-4 py-2 rounded-xl shadow-sm flex items-center gap-2">
                      {isSaved ? <><span className="w-2 h-2 rounded-full bg-green-500"></span>임시 저장됨</> : <><span className="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>작성 중...</>}
                    </div>
                  </div>
                  
                  {/* 텍스트 에디터 */}
                  <textarea
                    value={answer}
                    onChange={(e) => setAnswer(e.target.value)}
                    placeholder="현장 교사의 관점에서 구체적이고 논리적인 답안을 작성해주세요.&#13;&#10;(권장 분량: 공백 포함 1,100 ~ 1,200자)"
                    className="flex-grow w-full p-6 bg-slate-50 border border-slate-200 rounded-2xl resize-none focus:ring-4 focus:ring-indigo-50 focus:border-primary outline-none text-base md:text-lg leading-loose transition-all duration-300 placeholder-slate-400 custom-scrollbar mb-6"
                    spellCheck={false}
                  />
                  
                  {/* 하단 컨트롤 패널 */}
                  <div className="flex flex-col sm:flex-row justify-between items-center gap-4 pt-2">
                    <div className="flex gap-4 text-sm font-semibold bg-slate-50 px-5 py-3 rounded-xl border border-slate-100 w-full sm:w-auto justify-center">
                      <span className="text-slate-500">포함 <span className="text-slate-800 ml-1">{charCount.total}</span></span>
                      <span className="w-px bg-slate-300"></span>
                      <span className="text-slate-500">제외 
                        <span className={`ml-1 ${charCount.noSpaces < 1000 ? "text-rose-500" : "text-emerald-600"}`}>
                          {charCount.noSpaces}
                        </span>
                      </span>
                    </div>
                    <button 
                      onClick={handleSubmit}
                      className="w-full sm:w-auto bg-slate-800 hover:bg-slate-900 text-white font-bold text-lg py-3 px-10 rounded-xl shadow-md transition-all transform hover:-translate-y-0.5"
                    >
                      최종 제출하기
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* 3. 결과 화면 */}
            {status === 'result' && resultData && (
              <div className="bg-surface p-6 md:p-12 rounded-3xl shadow-sm border border-slate-100 mt-8 w-full max-w-4xl mx-auto">
                
                {/* 총점 헤더 */}
                <div className="text-center pb-10 mb-10 border-b border-slate-100">
                  <span className="inline-block bg-indigo-50 text-primary px-5 py-1.5 rounded-full text-sm font-bold tracking-wide mb-6">평가 결과 보고서</span>
                  <div className="flex justify-center items-end gap-2 mb-6">
                    <h2 className="text-5xl md:text-7xl font-black text-slate-800">{resultData.totalScore}</h2>
                    <span className="text-2xl md:text-3xl font-bold text-slate-400 mb-1 md:mb-2">/ 20</span>
                  </div>
                  <p className="text-slate-600 text-lg md:text-xl font-medium max-w-2xl mx-auto leading-relaxed break-keep">
                    {resultData.overallReview}
                  </p>
                </div>

                <div className="space-y-12">
                  {/* 내용 영역 */}
                  <section>
                    <div className="flex items-center gap-3 mb-6">
                      <div className="w-2 h-8 bg-primary rounded-full"></div>
                      <h3 className="text-2xl font-bold text-slate-800">
                        논술의 내용 <span className="text-primary ml-2">{resultData.contentScore}점</span>
                      </h3>
                    </div>
                    <div className="grid gap-4">
                      {resultData.contentFeedback.map((fb) => (
                        <div key={fb.questionId} className="bg-slate-50 p-6 rounded-2xl border border-slate-100 hover:border-indigo-200 transition-colors">
                          <div className="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-2 mb-4">
                            <span className="font-bold text-slate-800 text-lg">{fb.task.split(' ')[0]} 관련 논점</span>
                            <span className="bg-white border border-slate-200 text-slate-700 px-3 py-1 rounded-lg font-bold text-sm text-center">
                              {fb.earnedScore} / {fb.maxScore} 획득
                            </span>
                          </div>
                          {fb.missingKeywords && fb.missingKeywords.length > 0 && (
                            <div className="mb-3 flex flex-wrap gap-2">
                              <span className="text-sm font-bold text-rose-500 bg-rose-50 px-2.5 py-1 rounded-md">누락 키워드</span>
                              <span className="text-sm text-slate-600 pt-1">{fb.missingKeywords.join(', ')}</span>
                            </div>
                          )}
                          <p className="text-slate-600 leading-relaxed">{fb.comment}</p>
                        </div>
                      ))}
                    </div>
                  </section>

                  {/* 체계 영역 */}
                  <section>
                    <div className="flex items-center gap-3 mb-6">
                      <div className="w-2 h-8 bg-emerald-500 rounded-full"></div>
                      <h3 className="text-2xl font-bold text-slate-800">
                        논술의 체계 <span className="text-emerald-600 ml-2">{resultData.formatScore}점</span>
                      </h3>
                    </div>
                    <div className="bg-slate-50 p-6 rounded-2xl border border-slate-100 space-y-5">
                      <div>
                        <strong className="text-slate-800 block mb-2 font-bold text-lg">논리적 체계성</strong>
                        <p className="text-slate-600 leading-relaxed">{resultData.formatFeedback.structureComment}</p>
                      </div>
                      <div className="w-full h-px bg-slate-200"></div>
                      <div>
                        <strong className="text-slate-800 block mb-2 font-bold text-lg">맞춤법 및 어휘</strong>
                        <p className="text-slate-600 leading-relaxed">{resultData.formatFeedback.grammarComment}</p>
                      </div>
                    </div>
                  </section>
                </div>

                <div className="text-center mt-16">
                  <button 
                    onClick={handleGoHome}
                    className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-4 px-10 rounded-2xl transition-colors"
                  >
                    처음으로 돌아가기
                  </button>
                </div>
              </div>
            )}

          </div>
          
          {/* 하단 저작권 표시 */}
          <footer className="mt-16 mb-4 text-center text-slate-400 text-sm font-medium w-full tracking-wide">
            &copy; 2026. Made by. 엽쌤
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>

  <style>
    /* 스크롤바 디자인 커스텀 */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9; 
      border-radius: 8px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1; 
      border-radius: 8px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8; 
    }
  </style>
</body>
</html>
